[project]
name = "multilingual-bert-command-model"
version = "0.1.0"
description = "Indonesian+English multilingual intent classification + slot filling"
requires-python = ">=3.10"
dependencies = [
    "torch==2.13.0",
    "transformers",
    "datasets",
    "scikit-learn",
    "accelerate",
    "optuna>=3.6",
    "minio>=7.2,<8",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
